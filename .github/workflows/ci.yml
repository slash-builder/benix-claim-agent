# OSS-facing CI mirror, same shape as benix-mdns-advertiser's own workflow
# (fmt -> clippy -> test -> build on host, plus a real musl cross-compile).
# The studio's primary CI is Jenkins (https://jenkins.softsurve.com); this
# workflow runs the same checks on every push and PR so a contributor
# without internal Jenkins access still gets a green/red signal.
#
# Unlike the advertiser, this crate depends on a private-registry crate
# (fabric-kit, via the `lockamy` Nexus registry) — `.cargo/config.toml` in
# this repo defines WHERE that registry is (not a secret, committed).
# Checked before assuming otherwise: the `cargo-group` registry's index and
# crate downloads are unauthenticated reads (confirmed with a bare `curl`
# against both the sparse-index JSON and a crate .crate download, no
# credentials sent) — a token is only needed for `cargo publish`, which
# this repo doesn't do. fabric-kit's own CI (`slash-builder/fabric-kit/
# .github/workflows/ci.yml`, `Jenkinsfile`) confirms the same thing: no
# `secrets.*`/`credentialsId` reference anywhere in either, and its build/
# clippy/test steps run there against the same registry regardless. No
# secret wiring needed here either, so none is added.
#
# Does not publish anything yet — see README.md's "Known gaps" section.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  build:
    name: build (host)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

  musl:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    # Real on-target proof, not just a host build: BenixOS itself is
    # TCLIBC=musl. Spiked BEFORE this crate's own code was written (see
    # README.md) against a throwaway crate depending on fabric-kit via a
    # path dependency — confirmed a clean static-pie musl link there first,
    # this job re-proves it against this crate's actual source.
    steps:
      - uses: actions/checkout@v4

      - name: Install musl cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Build (musl, static)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Confirm the binary is actually static (no dynamic libc)
        # file(1)'s own ELF classification, not `ldd` — benix-mdns-
        # advertiser's own CI had a real bug where `ldd` misidentified a
        # genuinely-static musl binary as dynamic (both static-PIE and
        # dynamic ELFs use ET_DYN, and `ldd` doesn't reliably tell them
        # apart), fixed in a follow-up commit there. This check is that
        # fixed version, not the buggy one.
        run: |
          out="$(file -b target/x86_64-unknown-linux-musl/release/benix-claim-agent)"
          echo "$out"
          case "$out" in
            *"statically linked"*|*"static-pie linked"*)
              echo "Confirmed static." ;;
            *)
              echo "Expected a static/static-pie binary, got: $out"
              exit 1 ;;
          esac
